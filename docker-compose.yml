services:
  dashboard:
    build:
      context: ./fetcher
      dockerfile: Dockerfile
    container_name: mf_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DUCKDB_PATH=/app/data/mutual_funds.duckdb
      - TZ=Asia/Kolkata
      - AMFI_DOWNLOAD_PAGE=https://www.amfiindia.com/net-asset-value/nav-download
      - AMFI_HISTORY_URL=https://portal.amfiindia.com/DownloadNAVHistoryReport_Po.aspx
      - AMFI_DAILY_URL=https://portal.amfiindia.com/spages/NAVAll.txt
    volumes:
      - ./fetcher:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Webstack migration (see .claude/plans/floofy-petting-mountain.md) ---
  # backend/frontend run ALONGSIDE dashboard (kept as a legacy reference/
  # fallback), not replacing it yet, until the final cutover phase. backend
  # now runs on its own SQLite file (see app/db/connection.py) -- a clean
  # slate, no data carried over from dashboard's old DuckDB file -- so it
  # owns that file exclusively and is its own sole writer from the start;
  # the AMFI sync re-populates it from scratch (POST /api/admin/sync/* once
  # Phase 9 lands, or trigger amfi_sync directly in the meantime).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mf_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/mutual_funds.sqlite3
      - TZ=Asia/Kolkata
      - AMFI_DOWNLOAD_PAGE=https://www.amfiindia.com/net-asset-value/nav-download
      - AMFI_HISTORY_URL=https://portal.amfiindia.com/DownloadNAVHistoryReport_Po.aspx
      - AMFI_DAILY_URL=https://portal.amfiindia.com/spages/NAVAll.txt
      - ENABLE_SYNC_DAEMON=true
    volumes:
      - ./backend:/app
      # Read-write: this is backend's own, exclusively-owned data directory
      # (not shared with dashboard/fetcher's data dir at all anymore).
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mf_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
